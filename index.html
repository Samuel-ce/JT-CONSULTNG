<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JT CONSULTING - Asesoría Contable</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    background: #2E5473;
    color: white;
}

header {
    background: white;
    color: black;
    padding: 15px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    margin: 0 10px;
    text-decoration: none;
    color: black;
    font-weight: 500;
}

select {
    padding: 6px 10px;
    border-radius: 20px;
}

.hero {
    padding: 120px 10%;
    text-align: center;
}

.hero h1 {
    font-size: 2.8rem;
}

.button {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 25px;
    background: #A7C957;
    color: black;
    text-decoration: none;
    border-radius: 30px;
    font-weight: 600;
}
</style>
</head>

<body>

<header>
    <strong>JT CONSULTING</strong>
    
    <nav>
        <a href="#hero" data-i18n="menu_home">Inicio</a>
        <a href="#services" data-i18n="menu_services">Servicios</a>
        <a href="#contact" data-i18n="menu_contact">Contacto</a>
    </nav>

    <select id="language-selector">
        <option value="es">🇪🇸 Español</option>
        <option value="pt">🇧🇷 Português</option>
    </select>
</header>

<section class="hero" id="hero">
    <h1 data-i18n="hero_title">Asesoría Contable Profesional</h1>
    
    <p data-i18n="hero_text">
        Te ofrecemos soluciones fiscales y contables de calidad con profesionales capacitados.
    </p>

    <a href="https://wa.me/595973877773" class="button" data-i18n="hero_button">
        Contáctanos por WhatsApp
    </a>
</section>

<section id="services" style="padding:80px 10%; text-align:center;">
    <h2 data-i18n="services_title">Servicios Tributarios</h2>
</section>

<section id="contact" style="padding:80px 10%; text-align:center;">
    <h2 data-i18n="contact_title">Contáctanos</h2>
</section>

<script>

const translations = {

    es: {
        menu_home: "Inicio",
        menu_services: "Servicios",
        menu_contact: "Contacto",

        hero_title: "Asesoría Contable Profesional",
        hero_text: "Te ofrecemos soluciones fiscales y contables de calidad con profesionales capacitados.",
        hero_button: "Contáctanos por WhatsApp",

        services_title: "Servicios Tributarios",
        contact_title: "Contáctanos"
    },

    pt: {
        menu_home: "Início",
        menu_services: "Serviços",
        menu_contact: "Contato",

        hero_title: "Assessoria Contábil Profissional",
        hero_text: "Oferecemos soluções fiscais e contábeis de alta qualidade com profissionais capacitados.",
        hero_button: "Fale conosco pelo WhatsApp",

        services_title: "Serviços Tributários",
        contact_title: "Fale Conosco"
    }
};

const selector = document.getElementById("language-selector");

function changeLanguage(lang) {
    document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.getAttribute("data-i18n");
        if (translations[lang][key]) {
            element.textContent = translations[lang][key];
        }
    });

    document.documentElement.lang = lang;
    localStorage.setItem("selectedLanguage", lang);
}

selector.addEventListener("change", (e) => {
    changeLanguage(e.target.value);
});

window.addEventListener("DOMContentLoaded", () => {

    const savedLanguage = localStorage.getItem("selectedLanguage");

    if (savedLanguage) {
        selector.value = savedLanguage;
        changeLanguage(savedLanguage);
    } else {
        changeLanguage("es");
    }

});

</script>

</body>
</html>
